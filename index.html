<!DOCTYPE html>

<style>

  main{max-width:640px;margin:0 auto;padding:16px 16px 40px}

  h2{font-size:1.4rem;line-height:1.3;margin:20px 0 12px;color:var(--pri2)}

  .etapa{font-weight:700;margin:4px 0}
  progress{width:100%;height:14px;accent-color:var(--ver);display:block}
  p{margin:0 0 14px}
  .hint{color:var(--mut);font-size:1rem;margin:0 0 10px}
  .q{background:var(--card);border:1px solid #c3d3da;border-radius:14px;padding:16px;margin-bottom:18px}

  fieldset{border:0;margin:0;padding:0;min-width:0}
  legend.ql,label.ql{display:block;font-weight:700;margin-bottom:8px;padding:0}

  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .row legend{font-weight:600;padding:0 4px}
  .opts{display:flex;flex-direction:column}
  .scale .opts{flex-direction:row;flex-wrap:wrap;gap:8px}
  .scale .opt{width:56px;min-height:52px;margin:0;padding:0;justify-content:center;position:relative;font-weight:700}
  .scale .opt input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .scale .opt:has(input:checked){background:var(--pri);border-color:var(--pri2);color:#fff}
  .erro:empty,.aviso:empty{display:none}
  .erro{background:var(--errbg);color:var(--err);border-left:6px solid var(--err);padding:8px 12px;margin:0 0 10px;border-radius:6px;font-weight:600}
  .aviso{background:#fff6dd;color:#5a4300;border-left:6px solid #b58900;padding:8px 12px;margin:0 0 10px;border-radius:6px}
  .info{background:var(--info);border-left:6px solid var(--ver);padding:10px 14px;border-radius:6px;margin-top:8px;font-weight:600}
  .alerta{background:#fff1e0;border:2px solid #a65a00;color:#4a2900;padding:14px;border-radius:12px;margin:14px 0;font-weight:600}
  nav{display:flex;gap:12px;margin-top:8px}
  button{font:inherit;font-weight:700;min-height:52px;padding:10px 22px;border-radius:12px;border:2px solid var(--pri);cursor:pointer}
  .bp{background:var(--pri);color:#fff;flex:1}
  .bs{background:#fff;color:var(--pri2)}
  button:disabled{opacity:.6;cursor:not-allowed}
  #status{margin-top:12px}
  @media(min-width:700px){.row:not(.scale) .opts{flex-direction:row;gap:8px}.row:not(.scale) .opt{flex:1;margin-bottom:0}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

 q22:{id:'q22',num:22,type:'grid',text:'Nas últimas 2 semanas, com que frequência:',req:true,cols:FREQ5,rows:[{id:'q22a_sobrecarga',label:'a) Você se sentiu sobrecarregado(a) pelo cuidado?'},{id:'q22b_sem_tempo',label:'b) Sentiu que não tem tempo suficiente para você?'},{id:'q22c_cansaco',label:'c) Sentiu-se cansado(a) física ou emocionalmente?'},{id:'q22d_dores',label:'d) Teve dores no corpo por causa do esforço do cuidado?'},{id:'q22e_tristeza',label:'e) Sentiu-se triste, sem esperança ou sem vontade de fazer as coisas?'},{id:'q22f_sono_pouco',label:'f) Dormiu menos do que precisa?'}]},

 q24_acompanhamento:{id:'q24_acompanhamento',num:24,type:'radio',text:'Você faz algum acompanhamento de saúde para si (médico, psicólogo ou outro)?',opts:[['1','Sim'],['2','Não'],['3','Gostaria, mas não consigo']]},

 q25_entendimento:{id:'q25_entendimento',num:25,type:'scale',text:'Quanto você entende o diagnóstico da pessoa de quem cuida?',hint:'0 = nada · 10 = muito bem',req:true,cols:SC},
 q26:{id:'q26',num:26,type:'grid',text:'Responda Verdadeiro, Falso ou Não sei:',req:true,cols:[['1','Verdadeiro'],['2','Falso'],['3','Não sei']],rows:[{id:'q26a_cura',label:'a) A doença de Alzheimer tem cura se o tratamento começar cedo.'},{id:'q26b_repetir',label:'b) Repetir uma explicação com calma e frases curtas pode ajudar na comunicação.'},{id:'q26c_comportamento',label:'c) Mudanças de comportamento podem ser parte da doença, e não "birra" ou "má vontade".'},{id:'q26d_exercicio',label:'d) Exercícios e atividades podem ajudar na qualidade de vida, mas não impedem a doença de avançar.'},{id:'q26e_corrigir',label:'e) Discutir ou corrigir a pessoa a cada esquecimento costuma ajudar.'}]},

 q28_orientacoes:{id:'q28_orientacoes',num:28,type:'check',text:'Que orientações seriam mais úteis? Escolha até 3.',req:true,max:3,opts:[['1','Como lidar com agressividade e agitação'],['2','Como se comunicar melhor'],['3','Sono'],['4','Banho e higiene'],['5','Alimentação'],['6','Quedas e segurança'],['7','Atividades e estímulos cognitivos'],['8','Fisioterapia e exercícios'],['9','Medicamentos'],['10','Direitos, benefícios e curatela'],['11','Cuidar de mim'],['12','Outro']]},
 q28_outro_texto:{id:'q28_outro_texto',type:'text',sub:true,text:'Qual outra orientação?',show:a=>(a.q28_orientacoes||[]).includes('12')},

 q30_canais:{id:'q30_canais',num:30,type:'check',text:'Como você prefere receber informações?',hint:'Pode marcar mais de uma.',opts:[['1','Encontros presenciais'],['2','Online ao vivo'],['3','Vídeos gravados'],['4','Material escrito'],['5','WhatsApp']]},
 q30_melhor_horario:{id:'q30_melhor_horario',type:'text',sub:true,text:'Melhor dia e horário para você:',hint:'Opcional. Exemplo: terças, à tarde.'},

 q31_situacao_marcante:{id:'q31_situacao_marcante',num:31,type:'radio',text:'Houve uma situação recente que marcou você no cuidado?',opts:SN},

 {title:'Sobre a pessoa cuidada',qs:['q08_idade_cuidado','q09_diagnostico','q09_outro_texto','q10_fase']},

let sending = false;

function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){ if(k==='class')e.className=attrs[k]; else if(k==='text')e.textContent=attrs[k]; else e.setAttribute(k,attrs[k]); }
  kids.flat().forEach(x=>{ if(x) e.append(x); });
  return e;
}
function qtext(q){
  const f=document.createDocumentFragment();
  f.append((q.num?q.num+'. ':'')+q.text);
  if(q.req===true){ f.append(' ',h('span',{class:'ast','aria-hidden':'true',text:'*'}),h('span',{class:'vh',text:' (obrigatória)'})); }
  return f;
}
function opt(name,type,code,text,checked){
  const id=name+'_'+code;
  const inp=h('input',{type,name,id,value:code});
  if(checked) inp.checked=true;
  return h('label',{class:'opt',for:id},inp,h('span',{text}));
}
function row(q,r){
  const box=r.label?h('fieldset',{class:'row'+(q.scale?' scale':'')}):h('div',{class:'row scale',role:'radiogroup','aria-label':q.text});
  if(r.label) box.append(h('legend',{text:r.label}));
  const g=h('div',{class:'opts'});
  q.cols.forEach(([c,t])=>g.append(opt(r.id,'radio',c,t,A[r.id]===c)));
  box.append(g);
  return box;
}

/* ---------- Opções dinâmicas da pergunta 18 ---------- */
let dynCache='';
function fillDyn(){
  const q=Q.q18_mais_dificil, cont=$('o_q18_mais_dificil'); if(!cont) return;
  const key=JSON.stringify([A.q17_desafios,A.q17_outro_texto]);
  if(key===dynCache && cont.children.length) return;
  dynCache=key; cont.textContent='';
  const sel=A.q17_desafios||[];
  if(!sel.length){ cont.append(h('p',{class:'hint',text:'Primeiro escolha as situações na pergunta anterior.'})); delete A.q18_mais_dificil; return; }
  if(!sel.includes(A.q18_mais_dificil)) delete A.q18_mais_dificil;
  O17.filter(o=>sel.includes(o[0])).forEach(([c,t])=>{
    if(c==='16') t='Outro'+(A.q17_outro_texto?': '+A.q17_outro_texto:'');
    cont.append(opt('q18_mais_dificil','radio',c,t,A.q18_mais_dificil===c));
  });
}

/* ---------- Montagem de uma pergunta ---------- */
function renderQ(q){
  const w=h('div',{class:'q'+(q.sub?' sub':''),id:'w_'+q.id});
  const err=h('div',{class:'erro',id:'e_'+q.id,'aria-live':'polite'});
  if(q.type==='text'||q.type==='area'||q.type==='tel'){
    const hid=q.hint?'h_'+q.id:null;
    w.append(h('label',{for:'f_'+q.id,class:'ql'},qtext(q)));
    if(q.hint) w.append(h('p',{class:'hint',id:hid,text:q.hint}));
    w.append(err);
    const at={id:'f_'+q.id,name:q.id,'aria-describedby':'e_'+q.id+(hid?' '+hid:''),autocomplete:'off'};
    let f;
    if(q.type==='area'){at.rows='4'; f=h('textarea',at);}
    else{ at.type=q.type==='tel'?'tel':'text'; if(q.id==='q02_codigo'){at.maxlength='30';at.autocapitalize='characters';at.spellcheck='false';} if(q.type==='tel'){at.inputmode='tel';at.autocomplete='tel';} f=h('input',at); }
    f.value=A[q.id]||'';
    w.append(f);
  } else {
    const fs=h('fieldset'); fs.append(h('legend',{class:'ql'},qtext(q)));
    if(q.hint) fs.append(h('p',{class:'hint',text:q.hint}));
    fs.append(err);
    if(q.max) fs.append(h('div',{class:'aviso',id:'a_'+q.id,'aria-live':'polite'}));
    if(q.type==='radio'||q.type==='check'){
      const g=h('div',{id:'o_'+q.id});
      if(!q.dyn){
        const t=q.type==='radio'?'radio':'checkbox';
        q.opts.forEach(([c,tx])=>g.append(opt(q.id,t,c,tx,t==='radio'?A[q.id]===c:(A[q.id]||[]).includes(c))));
      }
      fs.append(g);
    } else if(q.type==='scale'){
      fs.append(row(q,{id:q.id}));
    } else if(q.type==='grid'){
      q.rows.forEach(r=>fs.append(row(q,r)));
    }
    w.append(fs);
  }
  if(q.note) w.append(h('div',{class:'info',id:'n_'+q.id,role:'status',text:q.note.text}));
  return w;
}

/* ---------- Respostas, validação e visibilidade ---------- */
function visible(q){return !q.show||q.show(A);}
function isReq(q){return typeof q.req==='function'?q.req(A):!!q.req;}
function answered(q){
  if(q.rows) return q.rows.every(r=>A[r.id]!==undefined&&A[r.id]!=='');
  const v=A[q.id];
  if(Array.isArray(v)) return v.length>0;
  return v!==undefined&&String(v).trim()!=='';
}
function errorFor(q){
  if(!visible(q)) return '';
  if(isReq(q)&&!answered(q)){
    if(q.rows) return 'Falta responder uma ou mais linhas. Role a tela e confira.';
    if(q.type==='check'&&q.max) return 'Falta responder esta pergunta. Escolha de 1 a '+q.max+' opções.';
    return 'Falta responder esta pergunta.';
  }
  if(q.id==='q02_codigo'&&!/^[A-Za-z]{2}[0-9]{4}$/.test(A.q02_codigo||'')) return 'O código tem 2 letras e 4 números, como CL1503.';
  if(q.id==='contato_telefone'&&isReq(q)&&String(A.contato_telefone||'').replace(/\D/g,'').length<10) return 'Informe o telefone com DDD, por exemplo (21) 99999-9999.';
  return '';
}
function refresh(){
  const s=SCREENS[st.S];
  s.qs.forEach(k=>{
    const q=Q[k], w=$('w_'+q.id); if(!w) return;
    w.hidden=!visible(q);
    if(q.note){ const n=$('n_'+q.id); if(n) n.hidden=!q.note.show(A); }
  });
  fillDyn();
  if(st.S===0) $('btnNext').textContent=(A.consentimento==='2')?'Encerrar':'Continuar';
}
function showErr(q,msg){
  const e=$('e_'+q.id); if(!e) return;
  e.textContent=msg;
  const w=$('w_'+q.id);
  if(w) w.querySelectorAll('input,textarea').forEach(i=>{ if(msg) i.setAttribute('aria-invalid','true'); else i.removeAttribute('aria-invalid'); });
}
function onChange(ev){
  const t=ev.target, name=t.name, q=NAMEQ[name]; if(!q) return;
  if(t.type==='checkbox'){
    const boxes=[...document.querySelectorAll('input[type=checkbox]')].filter(b=>b.name===name);
    if(q.exclusive&&t.checked){
      if(t.value===q.exclusive) boxes.forEach(b=>{if(b!==t)b.checked=false;});
      else boxes.forEach(b=>{if(b.value===q.exclusive)b.checked=false;});
    }
    const av=$('a_'+q.id);
    if(q.max&&t.checked&&boxes.filter(b=>b.checked).length>q.max){
      t.checked=false;
      if(av) av.textContent='Você já escolheu '+q.max+' opções. Para escolher outra, desmarque uma antes.';
    } else if(av) av.textContent='';
    A[name]=boxes.filter(b=>b.checked).map(b=>b.value);
  } else if(t.type==='radio'){
    A[name]=t.value;
  } else {
    A[name]=(name==='q02_codigo')?t.value.trim().toUpperCase():t.value;
  }
  if(answered(q)&&!errorFor(q)) showErr(q,'');
  save(); refresh();
}

/* ---------- Telas ---------- */
function sobrecarga(){return ['q22a_sobrecarga','q22e_tristeza'].some(k=>A[k]==='4'||A[k]==='5');}
const MSG_SOBRE='Percebemos que você está muito sobrecarregado(a). Procure a equipe de psicologia ou assistência social após o encontro; você não precisa passar por isso sozinho(a).';

function renderScreen(focus){
  const s=SCREENS[st.S], t=$('tela'); t.textContent='';
  const h2=h('h2',{tabindex:'-1',id:'titulo',text:s.title}); t.append(h2);
  (s.intro||[]).forEach(p=>t.append(h('p',{text:p})));
  if(s.final){
    t.append(h('p',{text:'Você chegou ao fim. Muito obrigado por dedicar seu tempo. Ao tocar em "Enviar respostas", suas respostas serão enviadas de forma sigilosa.'}));
    if(sobrecarga()) t.append(h('div',{class:'alerta',role:'status',text:MSG_SOBRE}));
  } else if(s.qs.some(k=>Q[k].req)){
    t.append(h('p',{class:'hint',text:'As perguntas com * precisam ser respondidas.'}));
  }
  s.qs.forEach(k=>t.append(renderQ(Q[k])));
  dynCache='';
  $('etapaTxt').textContent='Etapa '+(st.S+1)+' de '+SCREENS.length;
  $('prog').value=Math.round((st.S+1)/SCREENS.length*100);
  $('btnVoltar').hidden=(st.S===0);
  $('btnNext').textContent=s.final?'Enviar respostas':'Continuar';
  $('btnNext').disabled=false;
  $('status').textContent='';
  refresh();
  window.scrollTo(0,0);
  if(focus) h2.focus();
}
function go(n){st.S=n;save();renderScreen(true);}

function validar(){
  const s=SCREENS[st.S]; let first=null;
  s.qs.forEach(k=>{
    const q=Q[k], msg=errorFor(q); showErr(q,msg);
    if(msg&&!first) first=q;
  });
  if(first){
    const w=$('w_'+first.id);
    const f=w.querySelector('input,textarea');
    w.scrollIntoView({block:'start'});
    if(f) f.focus();
    return false;
  }
  return true;
}

/* ---------- Fim / envio ---------- */
function showEnd(){
  $('form').hidden=true; $('prog').value=100;
  $('etapaTxt').textContent='Concluído';
  const f=$('fim'); f.hidden=false; f.textContent='';
  if(st.done==='recusou'){
    f.append(h('h2',{text:'Obrigado pelo seu tempo',tabindex:'-1'}),h('p',{text:'Respeitamos a sua decisão. Nenhuma resposta foi enviada. Você pode fechar esta página.'}));
  } else {
    f.append(h('h2',{text:'Respostas enviadas. Muito obrigado!',tabindex:'-1'}),h('p',{text:'Sua participação ajuda a melhorar os encontros e o apoio a cuidadores. Cuide-se também.'}));
    if(sobrecarga()) f.append(h('div',{class:'alerta',role:'status',text:MSG_SOBRE}));
  }
  f.querySelector('h2').focus();
}
function buildPayload(){
  const p={};
  ORDER.forEach(k=>{
    const q=Q[k], vis=visible(q);
    idsOf(q).forEach(id=>{
      let v=vis?A[id]:'';
      if(v===undefined||v===null) v='';
      if(Array.isArray(v)) v=v.join(';');
      else if(v!==''&&(q.type==='radio'||q.type==='scale'||q.type==='grid')) v=Number(v);
      else if(typeof v==='string') v=v.trim();
      p[id]=v;
    });
  });
  p.q26_acertos=Object.keys(GABARITO).filter(k=>A[k]===GABARITO[k]).length;
  p.alerta_sobrecarga=sobrecarga()?'sim':'nao';
  p.data_hora=new Date().toISOString();
  p.tempo_total_seg=Math.round((Date.now()-st.inicio)/1000);
  p.id_envio=st.idEnvio;
  p.versao_form='v1';
  return p;
}
async function enviar(){
  if(sending) return;
  const btn=$('btnNext'), status=$('status');
  if(!ENDPOINT_URL){ status.innerHTML=''; status.append(h('p',{class:'erro',text:'O endereço de envio ainda não foi configurado (ENDPOINT_URL). Suas respostas continuam guardadas.'})); return; }
  sending=true; btn.disabled=true; btn.textContent='Enviando...'; status.textContent='';
  const ctrl=new AbortController(), tm=setTimeout(()=>ctrl.abort(),20000);
  try{
    const res=await fetch(ENDPOINT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(buildPayload()),signal:ctrl.signal});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const r=await res.json(); if(r&&r.ok===false) throw new Error(r.erro);
    st.done='enviado'; save(); showEnd();
  }catch(e){
    status.textContent='';
    status.append(h('p',{class:'erro',text:'Não foi possível enviar agora. Suas respostas estão guardadas. Verifique a internet e toque em "Tentar enviar de novo".'}));
    btn.disabled=false; btn.textContent='Tentar enviar de novo';
  }finally{ clearTimeout(tm); sending=false; }
}

/* ---------- Eventos ---------- */
$('form').addEventListener('change',onChange);
$('form').addEventListener('input',ev=>{const t=ev.target; if(t.matches('input[type=text],input[type=tel],textarea')) onChange(ev);});
$('btnVoltar').addEventListener('click',()=>{ if(st.S>0) go(st.S-1); });
$('btnNext').addEventListener('click',()=>{
  if(SCREENS[st.S].final){ enviar(); return; }
  if(!validar()) return;
  if(st.S===0&&A.consentimento==='2'){ st.A={}; Object.keys(A).forEach(k=>delete A[k]); st.done='recusou'; save(); showEnd(); return; }
  go(st.S+1);
});

/* ---------- Início ---------- */
if(st.done) showEnd(); else { st.S=Math.min(Math.max(st.S|0,0),LAST); renderScreen(false); }
})();
</script>
